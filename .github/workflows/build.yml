name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить yt-dlp и PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp pyinstaller

      - name: Скачать и распаковать ffmpeg
        shell: pwsh
        run: |
          curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Remove-Item -Path ffmpeg_tmp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Remove-Item -Path release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $ffmpeg  = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe  | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe не найден в архиве" }
          Copy-Item -Path $ffmpeg.FullName -Destination release\ffmpeg.exe -Force
          if ($ffprobe) {
            Copy-Item -Path $ffprobe.FullName -Destination release\ffprobe.exe -Force
         
          }
          Remove-Item -Path ffmpeg.zip -Force
          Remove-Item -Path ffmpeg_tmp -Recurse -Force

      - name: Собрать YouTubeDownloader.exe
        run: pyinstaller --onefile --noconsole --name YouTubeDownloader downloader.py

      - name: Собрать zip для скачивания
        run: |
          Copy-Item dist\YouTubeDownloader.exe release\
          Compress-Archive -Path release\* -DestinationPath YouTubeDownloader.zip -Force

      - name: Опубликовать артефакт
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader
          path: YouTubeDownloader.zip
          retention-days: 90
